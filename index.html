<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Boostrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    
    <img src="images/header.png" class="img-fluid w-100" style="height: 350px; object-fit: cover;" alt="Random number generator">

    <section class="container text-center">
        <h1 class="text-success fw-bold mb-3">RANDOM NUMBER GENERATOR</h1>
        <h4 class=" text-primary-emphasis fw-bold mb-3">Guess a number Between 1 to 10</h4>
    </section>

    <section class="d-flex justify-content-center">
        <div class="card" style="width: 18rem;">
            <div class="card-body mt-2 m-auto">
                <input type="number" id="inputNumber">
            </div>
        </div>
    </section>

    <section class="container text-center m-4">
            <button type="button" class="btn btn-outline-primary" onclick="checkValue()">SUBMIT</button>
            <button type="button" class="btn btn-outline-danger"  onclick="resetButton()">RESET</button>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>

</html>
